name: build

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows (driver + monitor + Config + package)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # package.ps1 locates MSBuild via vswhere and CMake from PATH,
      # builds everything, and assembles dist\driver_asvr.zip
      - name: Build and package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: driver_asvr
          path: dist/driver_asvr.zip
          if-no-files-found: error

  linux:
    name: Linux (driver + monitor + ctl + Config + package)
    runs-on: ubuntu-latest
    # glibc 2.35 baseline, matching the documented distrobox dev environment
    container: ubuntu:22.04
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake xorg-dev libgl1-mesa-dev git

      - uses: actions/checkout@v4

      - name: Build and package
        run: bash tools/package.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: driver_asvr_linux
          path: dist/driver_asvr_linux.tar.gz
          if-no-files-found: error

  # Pushing a v* tag publishes a GitHub release with both packages attached.
  # A release drafted by hand for the tag beforehand keeps its notes; only the
  # assets are (re)uploaded
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/driver_asvr.zip dist/driver_asvr_linux.tar.gz --clobber
          else
            gh release create "$TAG" dist/driver_asvr.zip dist/driver_asvr_linux.tar.gz \
              --title "ASVR $TAG" --generate-notes --verify-tag
          fi
